plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.86'
}

version = project.mod_version
group = project.mod_group
base.archivesName = "${project.mod_id}-${project.minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()

    // GregTech CEu Modern
    exclusiveContent {
        forRepository { maven { url = 'https://maven.gtceu.com' } }
        filter { includeGroup('com.gregtechceu.gtceu') }
    }
    // LDLib & Shimmer (GTCEu's UI / rendering lib)
    maven { name = 'FirstDarkDev'; url = 'https://maven.firstdark.dev/releases' }
    maven { name = 'FirstDarkDev Snapshots'; url = 'https://maven.firstdark.dev/snapshots' }
    // JEI (dev-only)
    exclusiveContent {
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup('mezz.jei') }
    }
    // Registrate
    exclusiveContent {
        forRepository { maven { url = 'https://maven.tterrag.com/' } }
        filter { includeGroup('com.tterrag.registrate') }
    }
    // CurseMaven / Modrinth fallbacks for transitive mod deps
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup('curse.maven') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // GregTech CEu Modern
    modImplementation "com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}"

    // GTCEu's public API references these at compile time. Compile-only:
    modCompileOnly "com.lowdragmc.ldlib:ldlib-forge-${project.minecraft_version}:${project.ldlib_version}"
    modCompileOnly "com.tterrag.registrate:Registrate:${project.registrate_version}"

    // JEI (dev-only)
    modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replacements = [
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
            version                : project.mod_version,
            minecraft_version_range: project.minecraft_version_range,
    ]
    inputs.properties replacements
    filesMatching('META-INF/mods.toml') {
        expand replacements
    }
    exclude '**/.DS_Store'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
